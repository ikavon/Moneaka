# 所有端点都走 OpenAI 兼容协议，除了 `backend: hf`（本地 transformers 直跑）。
# 值支持 `env:VAR` 与 `env:VAR:兜底`。

endpoints:
  # 强模型：造草稿 + 当评委。任何 OpenAI 兼容服务都行（DeepSeek / 通义 / 自建网关）。
  strong:
    base_url: env:MONEAKA_BASE_URL:https://api.openai.com/v1
    api_key: env:MONEAKA_API_KEY
    model: env:MONEAKA_STRONG_MODEL:gpt-4o-mini
    temperature: 0.7
    max_tokens: 400

  # 被测小模型：本地权重，不走网络。model 写 repo id 或 data/models 下的目录名。
  local:
    backend: hf
    model: env:MONEAKA_LOCAL_MODEL:Qwen3-1.7B
    temperature: 0.9
    max_tokens: 300
    enable_thinking: false      # Qwen3 默认会吐  thinking，润色任务必须关
    load_in_4bit: false         # 0.6B/1.7B 用 bf16 就够

# 角色 → 端点
roles:
  destyle: strong
  judge: strong
  restyle: local